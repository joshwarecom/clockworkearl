<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Refined Clockwork Teacup Logo SVG</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f8f9fa;
      margin: 0;
    }
    svg {
      background: white;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      border-radius: 8px;
    }
  </style>
</head>
<body>

<script>
function createGearPath(cx, cy, outerR, innerR, holeR, teeth, startAngle = 0) {
  let path = "";
  const step = (Math.PI * 2) / teeth;
  const tWidth = step * 0.3;

  for (let i = 0; i < teeth; i++) {
    const a0 = startAngle + i * step;
    const a1 = a0 + tWidth;
    const a2 = a0 + step * 0.5;
    const a3 = a2 + tWidth;

    const x0 = cx + outerR * Math.cos(a0), y0 = cy + outerR * Math.sin(a0);
    const x1 = cx + outerR * Math.cos(a1), y1 = cy + outerR * Math.sin(a1);
    const x2 = cx + innerR * Math.cos(a2), y2 = cy + innerR * Math.sin(a2);
    const x3 = cx + innerR * Math.cos(a3), y3 = cy + innerR * Math.sin(a3);

    if (i === 0) path += `M ${x0.toFixed(1)} ${y0.toFixed(1)} `;
    path += `L ${x1.toFixed(1)} ${y1.toFixed(1)} L ${x2.toFixed(1)} ${y2.toFixed(1)} L ${x3.toFixed(1)} ${y3.toFixed(1)} `;
  }
  path += "Z ";
  path += `M ${cx + holeR} ${cy} A ${holeR} ${holeR} 0 1 0 ${cx - holeR} ${cy} A ${holeR} ${holeR} 0 1 0 ${cx + holeR} ${cy} Z`;
  return path;
}

function renderRefinedLogo() {
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", "500");
  svg.setAttribute("height", "550");
  svg.setAttribute("viewBox", "0 0 500 550");

  const g = document.createElementNS(svgNS, "g");

  // 1. PERFECT YIN-YANG HANDLEBAR MUSTACHE (PROPORTIONAL 50% SIZE)
  const mustache = document.createElementNS(svgNS, "path");
  mustache.setAttribute("d", `
    M 315 72
    C 332.5 57 357.5 57 405 61
    Q 427.5 62 425 43.5
    C 452.5 91 367.5 101 321 85
    L 315 82
    C 262.5 101 177.5 91 205 43.5
    Q 202.5 62 225 61
    C 272.5 57 297.5 57 315 72
    Z
  `);
  mustache.setAttribute("fill", "#111111");
  g.appendChild(mustache);

  // 2. EVEN SHORTER & MORE WAVY STEAM RAYS
  const steam = document.createElementNS(svgNS, "path");
  steam.setAttribute("d", `
    M 265 270 C 235 245 295 220 265 195
    M 315 270 C 285 245 345 220 315 195
    M 365 270 C 335 245 395 220 365 195
  `);
  steam.setAttribute("fill", "none");
  steam.setAttribute("stroke", "#111111");
  steam.setAttribute("stroke-width", "6");
  steam.setAttribute("stroke-linecap", "round");
  g.appendChild(steam);

  // 3. TEACUP
  const cup = document.createElementNS(svgNS, "path");
  cup.setAttribute("d", "M 220 280 L 410 280 L 410 355 C 410 435 365 455 315 455 C 265 455 220 435 220 355 Z M 270 455 L 360 455 L 360 461 L 270 461 Z");
  cup.setAttribute("fill", "none");
  cup.setAttribute("stroke", "#111111");
  cup.setAttribute("stroke-width", "6");
  cup.setAttribute("stroke-linejoin", "round");
  g.appendChild(cup);

  // 4. GEARS IN TEA (4 Gears)
  const gearSpecs = [
    { cx: 270, cy: 350, outer: 48, inner: 40, hole: 12, teeth: 10, angle: 0 },
    { cx: 345, cy: 395, outer: 42, inner: 34, hole: 10, teeth: 10, angle: 0.2 },
    { cx: 375, cy: 342, outer: 26, inner: 20, hole: 6,  teeth: 8,  angle: 0.1 },
    { cx: 295, cy: 420, outer: 22, inner: 17, hole: 5,  teeth: 8,  angle: 0.3 }
  ];

  gearSpecs.forEach(spec => {
    const gearPath = document.createElementNS(svgNS, "path");
    gearPath.setAttribute("d", createGearPath(spec.cx, spec.cy, spec.outer, spec.inner, spec.hole, spec.teeth, spec.angle));
    gearPath.setAttribute("fill", "none");
    gearPath.setAttribute("fill-rule", "evenodd");
    gearPath.setAttribute("stroke", "#111111");
    gearPath.setAttribute("stroke-width", "5");
    gearPath.setAttribute("stroke-linejoin", "round");
    g.appendChild(gearPath);
  });

  // 5. DETAILED WINDING KEY HANDLE
  const keyGroup = document.createElementNS(svgNS, "g");
  keyGroup.setAttribute("fill", "none");
  keyGroup.setAttribute("stroke", "#111111");
  keyGroup.setAttribute("stroke-width", "4");
  keyGroup.setAttribute("stroke-linejoin", "round");

  // Key shaft & ornate bow outline
  const keyBody = document.createElementNS(svgNS, "path");
  keyBody.setAttribute("d", `
    M 220 350 L 195 350
    M 195 330 C 160 300 135 340 160 350 C 135 360 160 400 195 370 Z
  `);
  keyBody.setAttribute("stroke-width", "6");
  keyGroup.appendChild(keyBody);

  // Key decorative cutouts
  const cutout1 = document.createElementNS(svgNS, "circle");
  cutout1.setAttribute("cx", "172"); cutout1.setAttribute("cy", "332"); cutout1.setAttribute("r", "5");
  const cutout2 = document.createElementNS(svgNS, "circle");
  cutout2.setAttribute("cx", "172"); cutout2.setAttribute("cy", "368"); cutout2.setAttribute("r", "5");
  keyGroup.appendChild(cutout1);
  keyGroup.appendChild(cutout2);

  g.appendChild(keyGroup);

  // 6. MECHANICAL HAND WITH MULTI-JOINTED PINKY
  const handGroup = document.createElementNS(svgNS, "g");
  handGroup.setAttribute("fill", "none");
  handGroup.setAttribute("stroke", "#111111");
  handGroup.setAttribute("stroke-width", "14");
  handGroup.setAttribute("stroke-linecap", "round");
  handGroup.setAttribute("stroke-linejoin", "round");

  const fingerPaths = [
    "M 160 300 L 125 300 L 105 315 L 105 330",                     // Index
    "M 165 322 L 122 322 L 100 337 L 100 352",                     // Middle
    "M 160 344 L 120 344 L 98 359 L 98 374",                       // Ring
    "M 155 366 L 118 366 L 98 381",                               // Lower palm base
    "M 98 381 L 70 395 C 70 412 88 425 105 400"                   // Extended pinky with initial knuckle bend
  ];

  fingerPaths.forEach(d => {
    const p = document.createElementNS(svgNS, "path");
    p.setAttribute("d", d);
    handGroup.appendChild(p);
  });
  g.appendChild(handGroup);

  // 7. BOLTED JOINTS
  const jointsGroup = document.createElementNS(svgNS, "g");
  const jointCoords = [
    { cx: 160, cy: 300 }, { cx: 125, cy: 300 }, { cx: 105, cy: 315 },
    { cx: 165, cy: 322 }, { cx: 122, cy: 322 }, { cx: 100, cy: 337 },
    { cx: 160, cy: 344 }, { cx: 120, cy: 344 }, { cx: 98, cy: 359 },
    { cx: 155, cy: 366 }, { cx: 118, cy: 366 }, { cx: 98, cy: 381 },
    { cx: 70, cy: 395 },  { cx: 105, cy: 400 }  // Joints for the pinky bend
  ];

  jointCoords.forEach(j => {
    const outerCircle = document.createElementNS(svgNS, "circle");
    outerCircle.setAttribute("cx", j.cx);
    outerCircle.setAttribute("cy", j.cy);
    outerCircle.setAttribute("r", "4.5");
    outerCircle.setAttribute("fill", "#ffffff");
    outerCircle.setAttribute("stroke", "#111111");
    outerCircle.setAttribute("stroke-width", "2.5");

    const innerDot = document.createElementNS(svgNS, "circle");
    innerDot.setAttribute("cx", j.cx);
    innerDot.setAttribute("cy", j.cy);
    innerDot.setAttribute("r", "1");
    innerDot.setAttribute("fill", "#111111");

    jointsGroup.appendChild(outerCircle);
    jointsGroup.appendChild(innerDot);
  });

  g.appendChild(jointsGroup);
  svg.appendChild(g);
  document.body.appendChild(svg);
}

window.onload = renderRefinedLogo;
</script>

</body>
</html>
